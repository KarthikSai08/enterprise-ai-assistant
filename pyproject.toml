[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sql-chatbot"
version = "1.0.0"
description = "SQL Chatbot — Semantic metadata retrieval with BGE-M3 + BM25 + RRF + BGE Reranker + LLM-based SQL generation"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.0.0",
    "numpy>=1.24",
    "FlagEmbedding>=1.4.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0",
    "pyodbc>=5.1",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "rapidfuzz>=3.0.0",
    "rank_bm25>=0.2.2",
]

[tool.setuptools.packages.find]
where = ["src"]
