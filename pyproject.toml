[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sql-metadata-retrieval"
version = "1.0.0"
description = "SQL Metadata Retrieval — BGE-M3 + BM25 + RRF + BGE Reranker (No LLM)"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.24",
    "FlagEmbedding>=1.4.0",
    "qdrant-client>=1.9.0",
    "sentence-transformers>=3.0",
]

[tool.setuptools.packages.find]
where = ["src"]
