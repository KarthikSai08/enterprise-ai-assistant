[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sql-metadata-retrieval"
version = "1.0.0"
description = "SQL Metadata Retrieval — BGE-M3 + BM25 + RRF + BGE Reranker (No LLM)"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.24",
    "FlagEmbedding>=1.4.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0",
    "pyodbc>=5.1",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.0.0",
    "rank_bm25>=0.2.2",
]

[tool.setuptools.packages.find]
where = ["src"]
