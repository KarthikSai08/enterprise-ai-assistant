  # -- Business glossary: terms -> tables/columns --
  glossary:
    total_sales:
      definition: "Sum of all confirmed invoice amounts (grandTotal)"
      table: tbl_SaleInvoiceHeader
      column: grandTotal
      hint: "SUM(grandTotal) WHERE isConfirmed = 1"
    confirmed_invoice:
      definition: "An invoice that has been finalized"
      table: tbl_SaleInvoiceHeader
      column: isConfirmed
      hint: "WHERE isConfirmed = 1"
    pending_booking:
      definition: "Confirmed booking with undelivered quantity"
      table: tbl_Booking
      column: pendingQty
      hint: "WHERE isConfirmed = 1 AND pendingQty > 0"
    sauda:
      definition: "A confirmed purchase deal/contract"
      table: tbl_PurchaseEnquiry
      column: isConvertToSauda
      hint: "WHERE isConvertToSauda = 1"
    selling_rate:
      definition: "Declared daily selling rate per unit"
      table: tbl_GlobalSaleRate
      column: saleRate
      hint: "SELECT TOP 1 saleRate ORDER BY createdOn DESC"
    purchase_rate:
      definition: "Rate at which raw material is purchased"
      table: tbl_GlobalPurchaseRate
      column: purchaseRate
      hint: "SELECT TOP 1 purchaseRate ORDER BY createdOn DESC"
    dealer_sales:
      definition: "Sales transactions for a specific dealer"
      table: tbl_SaleInvoiceHeader
      column: dealerOrgId
      hint: "JOIN tbl_Organization ON dealerOrgId = idOrganization"
    net_weight_delivered:
      definition: "Actual product weight delivered"
      table: tbl_SaleInvoiceHeader
      column: netWeight
      hint: "SUM(netWeight)"
    vehicle_dispatched:
      definition: "A purchase vehicle that has left"
      table: tbl_PurchaseSchedule
      column: isVehicleOut
      hint: "WHERE isVehicleOut = 1"
    rate_band:
      definition: "Tiered pricing structure for purchases"
      table: tbl_RateBand
      column: globalPurchaseRateId
      hint: "JOIN tbl_GlobalPurchaseRate ON globalPurchaseRateId = idGlobalPurchaseRate"
    cnf_agent:
      definition: "C&F (Carrying & Forwarding) Agent in distribution chain"
      table: tbl_Booking
      column: cnFOrgId
      hint: "JOIN tbl_Organization ON cnFOrgId = idOrganization"
    booking_status:
      definition: "Current lifecycle status of a booking"
      table: dim_Status
      column: statusName
      hint: "JOIN dim_Status ON statusId = idStatus"
    stock_in_hand:
      definition: "Current stock balance in warehouse"
      table: tbl_StockLedger
      column: balanceQty
      hint: "SELECT SUM(balanceQty) ... WHERE ... GROUP BY productId"
    employee_count:
      definition: "Total number of active employees"
      table: tbl_Employee
      column: isActive
      hint: "SELECT COUNT(*) WHERE isActive = 1"
    payroll_monthly:
      definition: "Monthly salary paid to employees"
      table: tbl_PayrollHeader
      column: netPay
      hint: "SUM(netPay) GROUP BY payMonth, payYear"
    account_balance:
      definition: "Current balance of a ledger account"
      table: tbl_AccountLedger
      column: openingBalance
      hint: "Opening balance + debits - credits"
    gst_liability:
      definition: "Net GST payable to government"
      table: tbl_GSTReturn
      column: netGSTPayable
      hint: "totalOutward - totalInward"
    trip_status:
      definition: "Current status of a transport trip"
      table: dim_Status
      column: statusName
      hint: "JOIN dim_Status ON trip.statusId = idStatus"
    product_inventory:
      definition: "Quantity of product available in all warehouses"
      table: tbl_StockLedger
      column: balanceQty
      hint: "SUM(balanceQty) GROUP BY productId"
    purchase_order_value:
      definition: "Total value of purchase orders placed"
      table: tbl_PurchaseOrder
      column: totalAmount
      hint: "SUM(totalAmount) GROUP BY vendorId"
