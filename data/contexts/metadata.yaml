        data_type: int
        description: "Foreign key to tbl_Booking"
        business_label: "Booking / Order"
        nullable: false
        is_filter: true
        is_aggregation: false
        references: "tbl_Booking.idBooking"
      deliveryDate:
        data_type: date
        description: "Date of delivery"
        business_label: "Delivery Date"
        nullable: false
        is_filter: true
        is_aggregation: false
      deliveredQty:
        data_type: decimal
        description: "Quantity delivered"
        business_label: "Delivered Qty / Delivered Quantity"
        nullable: false
        is_filter: false
        is_aggregation: true
      invoiceId:
        data_type: int
        description: "Foreign key to tbl_SaleInvoiceHeader"
        business_label: "Invoice"
        nullable: true
        is_filter: true
        is_aggregation: false
        references: "tbl_SaleInvoiceHeader.idInvoice"
      vehicleNo:
        data_type: varchar
        description: "Vehicle number used for delivery"
        business_label: "Vehicle Number"
        nullable: true
        is_filter: true
        is_aggregation: false
      remarks:
        data_type: varchar
        description: "Delivery remarks"
        business_label: "Remarks"
        nullable: true
        is_filter: false
        is_aggregation: false
      createdOn:
        data_type: datetime
        description: "Record creation timestamp"
        business_label: "Created On"
        nullable: false
        is_filter: true
        is_aggregation: false
    filters:
      - bookingId
      - deliveryDate
      - invoiceId
    aggregation_columns:
      - deliveredQty
    notes: >
      Child of tbl_Booking. Multiple deliveries can exist per booking.
      SUM(deliveredQty) per booking should equal
      bookingQty - pendingQty.

