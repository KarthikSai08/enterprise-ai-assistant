        nullable: false
        is_filter: false
        is_aggregation: false
      classCode:
        data_type: varchar
        description: "Short class code"
        business_label: "Class Code"
        nullable: false
        is_filter: true
        is_aggregation: false
      className:
        data_type: varchar
        description: "Full class name"
        business_label: "Class Name / Product Class"
        nullable: false
        is_filter: true
        is_aggregation: false
      classDesc:
        data_type: varchar
        description: "Detailed description of the product class"
        business_label: "Class Description / Material Description"
        nullable: true
        is_filter: false
        is_aggregation: false
      categoryId:
