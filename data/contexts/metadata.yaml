        business_label: "Address Type"
        nullable: false
        is_filter: true
        is_aggregation: false
      addressLine1:
        data_type: varchar
        description: "First line of address"
        business_label: "Address Line 1"
        nullable: false
        is_filter: false
        is_aggregation: false
      addressLine2:
        data_type: varchar
        description: "Second line of address"
        business_label: "Address Line 2"
        nullable: true
        is_filter: false
