        business_label: "Payment Term ID"
        nullable: false
        is_filter: false
        is_aggregation: false
      termCode:
        data_type: varchar
        description: "Short code for the payment term"
        business_label: "Term Code"
        nullable: false
        is_filter: true
        is_aggregation: false
      termName:
        data_type: varchar
        description: "Full name of the payment term"
        business_label: "Term Name / Payment Condition"
        nullable: false
        is_filter: true
        is_aggregation: false
      dueDays:
        data_type: int
        description: "Number of days until payment is due"
        business_label: "Due Days / Credit Days"
        nullable: true
        is_filter: true
        is_aggregation: false
      isActive:
        data_type: bit
        description: "1 = active, 0 = inactive"
        business_label: "Active"
        nullable: false
        is_filter: true
        is_aggregation: false
    filters:
      - termCode
      - termName
      - isActive
    aggregation_columns: []
    notes: >
      Reference table. Joined by tbl_Organization.paymentTermId and
      tbl_SaleInvoiceHeader.paymentTermId.

  dim_TaxRate:
    display_name: "Tax Rate Master"
    purpose: >
