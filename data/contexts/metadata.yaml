        data_type: varchar
        description: "Transfer remarks"
        business_label: "Remarks / Notes"
        nullable: true
        is_filter: false
        is_aggregation: false
      createdOn:
        data_type: datetime
        description: "Record creation timestamp"
        business_label: "Created On"
        nullable: false
        is_filter: true
        is_aggregation: false
    filters:
      - transferDate
      - fromWarehouseId
      - toWarehouseId
      - productId
      - statusId
    aggregation_columns:
