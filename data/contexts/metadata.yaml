      inventory. Use for current stock balance, stock movement history,
      and inventory valuation.
    domain: inventory
    priority: 2
    is_view: false
    columns:
      idStockLedger:
        data_type: int
        description: "Primary key — unique ledger entry ID"
        business_label: "Stock Ledger ID / Transaction ID"
        nullable: false
        is_filter: false
        is_aggregation: false
      warehouseId:
        data_type: int
        description: "Foreign key to tbl_Warehouse"
        business_label: "Warehouse / Location"
        nullable: false
        is_filter: true
        is_aggregation: false
        references: "tbl_Warehouse.idWarehouse"
      productId:
        data_type: int
        description: "Foreign key to tbl_ProductMaster"
        business_label: "Product / Item"
        nullable: false
        is_filter: true
        is_aggregation: false
        references: "tbl_ProductMaster.idProduct"
      gradeId:
        data_type: int
        description: "Foreign key to tbl_ProductGrade"
        business_label: "Grade / Quality"
        nullable: true
        is_filter: true
        is_aggregation: false
        references: "tbl_ProductGrade.idGrade"
      transactionType:
        data_type: varchar
        description: "Type of transaction (e.g., Purchase, Sale, Transfer In, Transfer Out, Adjustment)"
        business_label: "Transaction Type / Movement Type"
        nullable: false
        is_filter: true
        is_aggregation: false
      refDocNo:
        data_type: varchar
        description: "Reference document number"
        business_label: "Reference Doc No / Source Document"
        nullable: true
        is_filter: true
        is_aggregation: false
      refDocType:
        data_type: varchar
        description: "Type of reference document (e.g., Invoice, PO, Transfer)"
        business_label: "Reference Doc Type"
        nullable: true
        is_filter: true
        is_aggregation: false
      inQty:
        data_type: decimal
        description: "Quantity received into stock"
        business_label: "In Qty / Received Qty"
        nullable: true
        is_filter: false
        is_aggregation: true
      outQty:
        data_type: decimal
        description: "Quantity issued/removed from stock"
        business_label: "Out Qty / Issued Qty / Sold Qty"
        nullable: true
        is_filter: false
        is_aggregation: true
      balanceQty:
        data_type: decimal
        description: "Running balance quantity after transaction"
        business_label: "Balance Qty / Closing Qty / Current Stock"
        nullable: false
        is_filter: false
        is_aggregation: true
      uomId:
        data_type: int
        description: "Foreign key to dim_UOM"
        business_label: "UOM / Unit"
        nullable: false
        is_filter: true
        is_aggregation: false
        references: "dim_UOM.idUOM"
      transactionDate:
        data_type: datetime
        description: "Date/time of the transaction"
        business_label: "Transaction Date / Movement Date"
        nullable: false
        is_filter: true
        is_aggregation: false
      createdOn:
        data_type: datetime
        description: "Record creation timestamp"
        business_label: "Created On / Entry Date"
        nullable: false
        is_filter: true
        is_aggregation: false
    filters:
      - warehouseId
      - productId
      - gradeId
      - transactionType
      - transactionDate
    aggregation_columns:
      - inQty
      - outQty
      - balanceQty
    notes: >
      Current stock = latest balanceQty per product-grade-warehouse.
      For stock position queries, use TOP 1 per product-grade-warehouse
      ORDER BY transactionDate DESC.

