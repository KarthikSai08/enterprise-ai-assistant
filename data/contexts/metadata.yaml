    domain: master_data_reference
    priority: 3
    is_view: false
    columns:
      idUOM:
        data_type: int
        description: "Primary key — unique UOM ID"
        business_label: "UOM ID / Unit ID"
        nullable: false
        is_filter: false
        is_aggregation: false
      uomCode:
        data_type: varchar
        description: "Short UOM code (e.g., KG, MT)"
        business_label: "UOM Code / Unit Code"
        nullable: false
        is_filter: true
        is_aggregation: false
      uomName:
        data_type: varchar
        description: "Full UOM name (e.g., Kilogram, Metric Ton)"
        business_label: "UOM Name / Unit Name"
        nullable: false
        is_filter: true
        is_aggregation: false
      uomType:
        data_type: varchar
        description: "Type category (e.g., Weight, Quantity, Volume)"
        business_label: "UOM Type / Unit Category"
        nullable: true
        is_filter: true
        is_aggregation: false
      isActive:
        data_type: bit
        description: "1 = active, 0 = inactive"
        business_label: "Active"
        nullable: false
        is_filter: true
        is_aggregation: false
    filters:
      - uomCode
      - uomName
      - uomType
    aggregation_columns: []
    notes: >
      Reference table. Joined by tbl_ProductMaster, tbl_SaleInvoiceDetail,
      tbl_PurchaseSchedule, tbl_StockLedger, and many others.

