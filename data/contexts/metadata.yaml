  tbl_TDSDeduction:
    display_name: "TDS Deduction"
    purpose: >
      TDS (Tax Deducted at Source) records against invoices and payments.
      Use for TDS compliance, deduction tracking, and challan management.
    domain: compliance
    priority: 3
    is_view: false
    columns:
      idTDS:
        data_type: int
        description: "Primary key — unique TDS record ID"
        business_label: "TDS ID / TDS Record ID"
        nullable: false
        is_filter: false
        is_aggregation: false
      tdsSection:
        data_type: varchar
        description: "TDS section under Income Tax Act (e.g., 194C, 194Q)"
        business_label: "TDS Section"
        nullable: false
        is_filter: true
        is_aggregation: false
      tdsRate:
        data_type: decimal
        description: "TDS rate percentage"
        business_label: "TDS Rate / Deduction %"
        nullable: false
        is_filter: false
        is_aggregation: true
      organizationId:
        data_type: int
        description: "Foreign key to tbl_Organization"
        business_label: "Organization / Party"
        nullable: false
        is_filter: true
        is_aggregation: false
