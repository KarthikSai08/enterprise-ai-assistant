  # ===========================================================================
  # BOOKINGS DOMAIN (Priority 1)
  # ===========================================================================

  tbl_Booking:
    display_name: "Booking"
    purpose: >
      All booking records — orders placed by dealers/distributors with
      expected delivery dates. Use for booking quantity, pending deliveries,
      and booking status queries.
    domain: bookings
    priority: 1
    is_view: false
    columns:
      idBooking:
        data_type: int
        description: "Primary key — unique booking ID"
        business_label: "Booking ID / Order ID"
        nullable: false
        is_filter: false
        is_aggregation: false
      bookingNo:
        data_type: varchar
        description: "Unique booking document number"
        business_label: "Booking Number / Order Number"
        nullable: false
        is_filter: true
        is_aggregation: false
      bookingDate:
        data_type: date
        description: "Date the booking was made"
        business_label: "Booking Date / Order Date"
        nullable: false
        is_filter: true
        is_aggregation: false
      dealerOrgId:
        data_type: int
        description: "Foreign key to tbl_Organization — dealer who placed the booking"
        business_label: "Dealer / Buyer"
        nullable: true
        is_filter: true
        is_aggregation: false
        references: "tbl_Organization.idOrganization"
      cnFOrgId:
        data_type: int
        description: "Foreign key to tbl_Organization — C&F agent linked"
        business_label: "C&F Agent / Carrying & Forwarding Agent"
        nullable: true
        is_filter: true
        is_aggregation: false
        references: "tbl_Organization.idOrganization"
      productId:
        data_type: int
        description: "Foreign key to tbl_ProductMaster"
        business_label: "Product / Item"
        nullable: false
        is_filter: true
        is_aggregation: false
        references: "tbl_ProductMaster.idProduct"
      gradeId:
        data_type: int
        description: "Foreign key to tbl_ProductGrade"
        business_label: "Grade / Quality"
        nullable: true
        is_filter: true
        is_aggregation: false
        references: "tbl_ProductGrade.idGrade"
      bookingQty:
        data_type: decimal
        description: "Total quantity booked"
        business_label: "Booking Quantity / Order Qty / Booked Qty"
        nullable: false
        is_filter: false
        is_aggregation: true
      pendingQty:
        data_type: decimal
        description: "Quantity yet to be delivered"
        business_label: "Pending Quantity / Outstanding / Balance Qty"
        nullable: true
        is_filter: false
        is_aggregation: true
      rate:
        data_type: decimal
        description: "Rate/price at the time of booking"
        business_label: "Rate / Price / Booking Rate"
        nullable: true
        is_filter: false
        is_aggregation: true
      totalAmount:
        data_type: decimal
        description: "Total booking amount"
        business_label: "Total Amount / Booking Value"
        nullable: true
        is_filter: false
        is_aggregation: true
      statusId:
        data_type: int
        description: "Foreign key to dim_Status"
        business_label: "Status"
        nullable: false
        is_filter: true
        is_aggregation: false
        references: "dim_Status.idStatus"
      isConfirmed:
        data_type: bit
        description: "1 = confirmed booking, 0 = draft/unconfirmed"
        business_label: "Confirmed / Active"
        nullable: false
        is_filter: true
        is_aggregation: false
        value_map:
          "1": "Confirmed"
          "0": "Draft / Pending Confirmation"
      remarks:
        data_type: varchar
        description: "Booking remarks"
        business_label: "Remarks / Notes"
        nullable: true
        is_filter: false
        is_aggregation: false
      expectedDate:
        data_type: date
        description: "Expected delivery date"
        business_label: "Expected Date / Expected Delivery"
        nullable: true
        is_filter: true
        is_aggregation: false
      createdOn:
        data_type: datetime
        description: "Record creation timestamp"
        business_label: "Created On / Booking Entry Date"
        nullable: false
        is_filter: true
        is_aggregation: false
      createdBy:
        data_type: int
        description: "User ID who created the booking"
        business_label: "Created By"
        nullable: true
        is_filter: false
        is_aggregation: false
    filters:
      - isConfirmed
      - statusId
      - dealerOrgId
      - cnFOrgId
      - productId
      - bookingDate
      - expectedDate
    aggregation_columns:
      - bookingQty
      - pendingQty
      - rate
      - totalAmount
    notes: >
      pendingQty = bookingQty minus already-delivered quantity.
      For 'open orders', filter isConfirmed=1 AND pendingQty > 0.
      Parent for tbl_BookingDelivery.

  tbl_BookingDelivery:
    display_name: "Booking Delivery"
    purpose: >
      Delivery records against bookings — tracks partial and full deliveries.
      Use for delivery tracking and fulfillment status.
    domain: bookings
    priority: 1
    is_view: false
