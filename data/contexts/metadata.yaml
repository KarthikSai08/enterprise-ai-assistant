  tbl_OrgBankDetail:
    display_name: "Organization Bank Details"
    purpose: >
      Bank account details linked to organizations. Use for queries about
      payment remittance, bank accounts, or IFSC codes.
    domain: organization
    priority: 2
    is_view: false
    columns:
      idOrgBank:
        data_type: int
        description: "Primary key — unique bank detail ID"
        business_label: "Bank Detail ID"
        nullable: false
        is_filter: false
        is_aggregation: false
      organizationId:
        data_type: int
        description: "Foreign key to tbl_Organization"
        business_label: "Organization"
        nullable: false
        is_filter: true
        is_aggregation: false
        references: "tbl_Organization.idOrganization"
      bankName:
        data_type: varchar
        description: "Name of the bank"
        business_label: "Bank Name"
        nullable: false
        is_filter: true
        is_aggregation: false
      branchName:
        data_type: varchar
        description: "Branch name"
        business_label: "Branch Name"
        nullable: true
        is_filter: false
        is_aggregation: false
      accountNo:
        data_type: varchar
        description: "Bank account number"
        business_label: "Account Number"
        nullable: false
        is_filter: false
        is_aggregation: false
      ifscCode:
        data_type: varchar
        description: "IFSC code for the branch"
        business_label: "IFSC Code"
        nullable: false
        is_filter: true
        is_aggregation: false
      accountHolder:
        data_type: varchar
        description: "Name of the account holder"
        business_label: "Account Holder Name"
        nullable: true
        is_filter: false
        is_aggregation: false
      isDefault:
        data_type: bit
        description: "1 = default bank account for the organization"
        business_label: "Default Account"
        nullable: false
        is_filter: true
        is_aggregation: false
      isActive:
        data_type: bit
        description: "1 = active, 0 = inactive"
        business_label: "Active"
        nullable: false
        is_filter: true
        is_aggregation: false
    filters:
      - organizationId
      - bankName
      - ifscCode
      - isDefault
    aggregation_columns: []
    notes: >
      Child of tbl_Organization. An organization may have multiple bank
      accounts; isDefault identifies the primary one.

