        description: "Type of rate (Sale/Purchase)"
        business_label: "Rate Type"
        nullable: false
        is_filter: true
        is_aggregation: false
      refRateId:
        data_type: int
        description: "Reference to the original rate record being changed"
        business_label: "Reference Rate ID"
        nullable: true
        is_filter: true
        is_aggregation: false
      requestedRate:
        data_type: decimal
        description: "Rate requested by the user"
        business_label: "Requested Rate / Proposed Rate"
        nullable: false
        is_filter: false
        is_aggregation: true
      approvedRate:
        data_type: decimal
        description: "Rate approved after review"
        business_label: "Approved Rate / Final Rate"
        nullable: true
        is_filter: false
        is_aggregation: true
      requestedBy:
        data_type: int
        description: "User ID who requested the rate change"
        business_label: "Requested By"
        nullable: false
        is_filter: true
        is_aggregation: false
      approvedBy:
        data_type: int
        description: "User ID who approved/rejected the request"
        business_label: "Approved By"
        nullable: true
        is_filter: true
        is_aggregation: false
      approvalStatus:
        data_type: varchar
        description: "Status (e.g., Pending, Approved, Rejected)"
        business_label: "Approval Status"
        nullable: false
        is_filter: true
        is_aggregation: false
      remarks:
        data_type: varchar
        description: "Remarks/notes about the approval"
        business_label: "Remarks / Comments"
        nullable: true
        is_filter: false
        is_aggregation: false
      requestedOn:
        data_type: datetime
        description: "Date/time when rate was requested"
        business_label: "Requested On / Request Date"
        nullable: false
        is_filter: true
        is_aggregation: false
      approvedOn:
        data_type: datetime
        description: "Date/time when request was approved/rejected"
        business_label: "Approved On / Decision Date"
        nullable: true
        is_filter: true
        is_aggregation: false
    filters:
      - rateType
      - approvalStatus
      - requestedBy
