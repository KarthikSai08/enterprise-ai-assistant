        is_aggregation: false
      totalOutward:
        data_type: decimal
        description: "Total outward/sales amount"
        business_label: "Total Outward / Total Sales"
        nullable: true
        is_filter: false
        is_aggregation: true
      totalInward:
        data_type: decimal
