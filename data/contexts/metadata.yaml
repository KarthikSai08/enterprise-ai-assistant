      invoiceId:
        data_type: int
        description: "Foreign key to tbl_SaleInvoiceHeader"
        business_label: "Invoice"
        nullable: true
        is_filter: true
        is_aggregation: false
        references: "tbl_SaleInvoiceHeader.idInvoice"
      tdsAmount:
        data_type: decimal
        description: "TDS amount deducted"
        business_label: "TDS Amount / Deduction Amount"
        nullable: false
        is_filter: false
        is_aggregation: true
      tdsDate:
        data_type: date
        description: "Date of TDS deduction"
        business_label: "TDS Date / Deduction Date"
        nullable: false
        is_filter: true
        is_aggregation: false
      challanNo:
        data_type: varchar
        description: "Challan number for TDS payment"
        business_label: "Challan Number / Payment Challan"
        nullable: true
        is_filter: true
        is_aggregation: false
      statusId:
        data_type: int
        description: "Foreign key to dim_Status"
        business_label: "Status"
        nullable: false
        is_filter: true
        is_aggregation: false
        references: "dim_Status.idStatus"
      createdOn:
        data_type: datetime
        description: "Record creation timestamp"
        business_label: "Created On"
        nullable: false
        is_filter: true
        is_aggregation: false
    filters:
      - tdsSection
      - organizationId
      - invoiceId
      - tdsDate
      - statusId
    aggregation_columns:
      - tdsRate
      - tdsAmount
    notes: >
      TDS deducted at source. tdsAmount = invoice amount * tdsRate / 100.
      Challan No refers to the deposited TDS challan.

