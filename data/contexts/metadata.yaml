        business_label: "Active"
        nullable: false
        is_filter: true
        is_aggregation: false
    filters:
      - className
      - categoryId
      - isActive
    aggregation_columns: []
    notes: >
      Child of tbl_ProductCategory. Join via tbl_ProductMaster.classId.

  tbl_ProductMaster:
    display_name: "Product Master"
    purpose: >
      Core product catalog containing all finished goods and raw materials.
      Use for product lookups, inventory, and sales/purchase queries.
    domain: product
