        data_type: date
        description: "Date of physical count"
        business_label: "Count Date / Inventory Date"
        nullable: false
        is_filter: true
        is_aggregation: false
      remarks:
        data_type: varchar
        description: "Count remarks"
        business_label: "Remarks / Notes"
        nullable: true
        is_filter: false
        is_aggregation: false
      createdOn:
        data_type: datetime
        description: "Record creation timestamp"
        business_label: "Created On"
        nullable: false
        is_filter: true
        is_aggregation: false
    filters:
      - warehouseId
      - productId
      - countDate
    aggregation_columns:
      - systemQty
      - physicalQty
      - varianceQty
    notes: >
      Positive variance = excess stock, negative variance = shortage.
      Large variances indicate potential issues requiring investigation.

