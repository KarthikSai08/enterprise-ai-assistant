    is_view: false
    columns:
      idProduct:
        data_type: int
        description: "Primary key — unique product ID"
        business_label: "Product ID / Item ID"
        nullable: false
        is_filter: false
        is_aggregation: false
      productCode:
        data_type: varchar
        description: "Unique product/item code"
        business_label: "Product Code / Item Code / SKU"
        nullable: false
        is_filter: true
        is_aggregation: false
      productName:
        data_type: varchar
        description: "Full product name"
        business_label: "Product Name / Item Name / Material Name"
        nullable: false
        is_filter: true
        is_aggregation: false
      productDesc:
        data_type: varchar
        description: "Detailed product description"
        business_label: "Product Description"
        nullable: true
        is_filter: false
        is_aggregation: false
      categoryId:
        data_type: int
        description: "Foreign key to tbl_ProductCategory"
        business_label: "Category"
        nullable: false
        is_filter: true
        is_aggregation: false
        references: "tbl_ProductCategory.idCategory"
      classId:
        data_type: int
        description: "Foreign key to tbl_ProductClass"
        business_label: "Product Class"
        nullable: false
        is_filter: true
        is_aggregation: false
        references: "tbl_ProductClass.idProdClass"
      baseUOMId:
        data_type: int
        description: "Foreign key to dim_UOM — base stocking unit"
        business_label: "Base UOM / Stocking Unit"
        nullable: false
        is_filter: true
        is_aggregation: false
        references: "dim_UOM.idUOM"
      purchaseUOMId:
        data_type: int
        description: "Foreign key to dim_UOM — purchasing unit"
        business_label: "Purchase UOM / Procurement Unit"
        nullable: false
        is_filter: true
        is_aggregation: false
        references: "dim_UOM.idUOM"
      saleUOMId:
        data_type: int
        description: "Foreign key to dim_UOM — sales unit"
        business_label: "Sale UOM / Selling Unit"
        nullable: false
        is_filter: true
        is_aggregation: false
        references: "dim_UOM.idUOM"
      hsnCode:
        data_type: varchar
        description: "HSN/SAC code for GST classification"
        business_label: "HSN Code / SAC Code"
        nullable: true
        is_filter: true
        is_aggregation: false
      gstRateId:
        data_type: int
        description: "Foreign key to dim_TaxRate — applicable GST rate"
        business_label: "GST Rate / Tax Slab"
        nullable: true
        is_filter: true
        is_aggregation: false
        references: "dim_TaxRate.idTaxRate"
      reorderLevel:
        data_type: decimal
        description: "Minimum stock level triggering reorder"
        business_label: "Reorder Level / Minimum Stock Trigger"
        nullable: true
        is_filter: false
        is_aggregation: false
      minStock:
        data_type: decimal
        description: "Minimum stock quantity to maintain"
        business_label: "Min Stock / Safety Stock"
        nullable: true
        is_filter: false
        is_aggregation: false
      maxStock:
        data_type: decimal
        description: "Maximum stock quantity"
        business_label: "Max Stock / Maximum Inventory"
        nullable: true
        is_filter: false
        is_aggregation: false
      isBatchManaged:
        data_type: bit
        description: "1 = product uses batch tracking"
        business_label: "Batch Managed / Batch Tracked"
        nullable: false
        is_filter: true
        is_aggregation: false
      isSerialManaged:
        data_type: bit
        description: "1 = product uses serial number tracking"
        business_label: "Serial Managed / Serial Tracked"
        nullable: false
        is_filter: true
        is_aggregation: false
      isActive:
        data_type: bit
        description: "1 = active, 0 = inactive"
        business_label: "Active"
        nullable: false
        is_filter: true
        is_aggregation: false
      createdOn:
        data_type: datetime
        description: "Record creation timestamp"
        business_label: "Created On"
        nullable: false
        is_filter: true
        is_aggregation: false
    filters:
      - productName
      - productCode
      - categoryId
      - classId
      - hsnCode
      - isActive
    aggregation_columns: []
    notes: >
      Central product table. Joined by most transactional tables including
      tbl_SaleInvoiceDetail, tbl_Booking, tbl_PurchaseSchedule,
      tbl_StockLedger, tbl_QualityParameter, and many more.

  tbl_ProductGrade:
    display_name: "Product Grade"
    purpose: >
      Grades/qualities for each product (e.g., Grade A, Grade B). Use when
