        data_type: varchar
        description: "Unique warehouse code"
        business_label: "Warehouse Code / Location Code"
        nullable: false
        is_filter: true
        is_aggregation: false
      warehouseName:
        data_type: varchar
        description: "Full warehouse name"
        business_label: "Warehouse Name / Location Name"
        nullable: false
        is_filter: true
        is_aggregation: false
      addressLine1:
        data_type: varchar
        description: "First line of warehouse address"
        business_label: "Address Line 1"
        nullable: true
        is_filter: false
        is_aggregation: false
      cityId:
