# =============================================================================
# metadata.yaml
# Core table + column metadata for SQL RAG retrieval.
# Database: SQLChatBot_DB — 69 tables across 12 domains.
# HOW TO SCALE: Add new table blocks following the same schema.
#               The retrieval pipeline reads this file at startup.
# =============================================================================

version: "1.0"
last_updated: "2026-07"
total_tables: 69

tables:

  # ===========================================================================
  # MASTER DATA — GEO (Priority 3)
  # ===========================================================================

  dmn_Country:
    display_name: "Country Master"
    purpose: >
      Lookup table of all countries. Use when filtering or grouping by country
      or when resolving country IDs to country codes/names.
    domain: master_data_geo
    priority: 3
    is_view: false
    columns:
      idCountry:
        data_type: int
        description: "Primary key — unique country ID"
        business_label: "Country ID"
        nullable: false
        is_filter: false
        is_aggregation: false
      countryCode:
        data_type: varchar
        description: "ISO country code (e.g., IN, US)"
        business_label: "Country Code / ISO Code"
        nullable: false
        is_filter: true
        is_aggregation: false
      countryName:
        data_type: varchar
        description: "Full country name"
        business_label: "Country Name"
        nullable: false
        is_filter: true
        is_aggregation: false
      phoneCode:
        data_type: varchar
        description: "International dialing code (e.g., +91)"
        business_label: "Phone Code / Dial Code"
        nullable: true
        is_filter: false
        is_aggregation: false
      isActive:
        data_type: bit
        description: "1 = active, 0 = inactive"
        business_label: "Active"
        nullable: false
        is_filter: true
        is_aggregation: false
    filters:
      - countryCode
      - countryName
      - isActive
    aggregation_columns: []
    notes: >
      Reference table. Joined by dmn_State.countryId.

  dmn_State:
    display_name: "State Master"
    purpose: >
      Lookup table of states/provinces linked to countries. Use when filtering
      or grouping by state.
    domain: master_data_geo
    priority: 3
    is_view: false
    columns:
      idState:
        data_type: int
        description: "Primary key — unique state ID"
        business_label: "State ID"
        nullable: false
        is_filter: false
        is_aggregation: false
      countryId:
        data_type: int
        description: "Foreign key to dmn_Country"
        business_label: "Country"
        nullable: false
        is_filter: true
        is_aggregation: false
        references: "dmn_Country.idCountry"
      stateCode:
        data_type: varchar
        description: "State code (e.g., GJ, MH)"
        business_label: "State Code"
        nullable: false
        is_filter: true
        is_aggregation: false
      stateName:
        data_type: varchar
        description: "Full state name"
        business_label: "State Name"
        nullable: false
        is_filter: true
        is_aggregation: false
      isActive:
        data_type: bit
        description: "1 = active, 0 = inactive"
        business_label: "Active"
        nullable: false
        is_filter: true
        is_aggregation: false
    filters:
      - countryId
      - stateCode
      - stateName
      - isActive
    aggregation_columns: []
    notes: >
      Reference table. Joined by dmn_City.stateId and tbl_Organization.cityId.

  dmn_City:
    display_name: "City Master"
    purpose: >
      Lookup table of cities linked to states. Use when filtering or grouping
      by city, or resolving city names from IDs.
    domain: master_data_geo
    priority: 3
    is_view: false
    columns:
      idCity:
        data_type: int
        description: "Primary key — unique city ID"
        business_label: "City ID"
        nullable: false
        is_filter: false
        is_aggregation: false
      stateId:
        data_type: int
        description: "Foreign key to dmn_State"
        business_label: "State"
        nullable: false
        is_filter: true
        is_aggregation: false
        references: "dmn_State.idState"
      cityName:
        data_type: varchar
        description: "Full city name"
        business_label: "City Name"
        nullable: false
        is_filter: true
        is_aggregation: false
      pinCode:
        data_type: varchar
        description: "Postal/ZIP code"
        business_label: "Pin Code / Postal Code / ZIP Code"
        nullable: true
        is_filter: true
        is_aggregation: false
      isActive:
        data_type: bit
        description: "1 = active, 0 = inactive"
        business_label: "Active"
        nullable: false
        is_filter: true
        is_aggregation: false
    filters:
      - stateId
      - cityName
      - pinCode
      - isActive
    aggregation_columns: []
    notes: >
      Reference table. Joined by many tables including tbl_Organization,
      tbl_Warehouse, tbl_Employee, tbl_RouteMaster, tbl_OrgAddress.

  # ===========================================================================
  # MASTER DATA — REFERENCE (Priority 3)
  # ===========================================================================

  dim_OrgType:
    display_name: "Organization Type"
    purpose: >
      Lookup table that defines types of organizations (e.g., Dealer,
      Distributor, C&F Agent, Vendor). Use when filtering by organization category.
    domain: master_data_reference
    priority: 3
    is_view: false
    columns:
      idOrgType:
        data_type: int
        description: "Primary key — unique org type ID"
        business_label: "Org Type ID"
        nullable: false
        is_filter: false
        is_aggregation: false
      orgTypeCode:
        data_type: varchar
        description: "Short code for org type"
        business_label: "Org Type Code"
        nullable: false
        is_filter: true
        is_aggregation: false
      orgTypeName:
        data_type: varchar
        description: "Human-readable org type name"
        business_label: "Org Type Name / Organization Category"
        nullable: false
        is_filter: true
        is_aggregation: false
      description:
        data_type: varchar
        description: "Detailed description of the org type"
        business_label: "Description"
        nullable: true
        is_filter: false
        is_aggregation: false
      isActive:
        data_type: bit
        description: "1 = active, 0 = inactive"
        business_label: "Active"
        nullable: false
        is_filter: true
        is_aggregation: false
    filters:
      - orgTypeName
      - orgTypeCode
      - isActive
    aggregation_columns: []
    notes: >
      Small reference table. Join via tbl_Organization.orgTypeId.

  dim_Status:
    display_name: "Status Master"
    purpose: >
      Lookup table for all status codes used across bookings, schedules,
      purchases, HR, and finance records. Use when filtering or displaying
      status names instead of raw IDs.
    domain: master_data_reference
    priority: 3
    is_view: false
    columns:
      idStatus:
        data_type: int
        description: "Primary key — unique status ID"
        business_label: "Status ID"
        nullable: false
        is_filter: false
        is_aggregation: false
      statusCategory:
        data_type: varchar
        description: "Category grouping (e.g., Booking, Purchase, HR)"
        business_label: "Status Category"
        nullable: true
        is_filter: true
        is_aggregation: false
      statusCode:
        data_type: varchar
        description: "Short status code"
        business_label: "Status Code"
        nullable: false
        is_filter: true
        is_aggregation: false
      statusName:
        data_type: varchar
        description: "Human-readable status label (e.g., Pending, Delivered, Cancelled)"
        business_label: "Status Name / Status Label"
        nullable: false
        is_filter: true
        is_aggregation: false
      isActive:
        data_type: bit
        description: "1 = active, 0 = inactive"
        business_label: "Active"
        nullable: false
        is_filter: true
        is_aggregation: false
    filters:
      - statusName
      - statusCategory
      - statusCode
    aggregation_columns: []
    notes: >
      Used by many tables including tbl_Booking, tbl_PurchaseSchedule,
      tbl_PurchaseOrder, tbl_LeaveApplication, tbl_PayrollHeader, etc.
      Always join this table when the user asks about status names.

  dim_UOM:
    display_name: "Unit of Measure Master"
    purpose: >
      Lookup table for units of measure (e.g., KG, MT, PCS). Use when
