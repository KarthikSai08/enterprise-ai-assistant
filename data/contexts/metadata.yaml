        is_aggregation: false
      regNumber:
        data_type: varchar
        description: "Registration/license number"
        business_label: "Registration Number / License Number"
        nullable: false
        is_filter: true
        is_aggregation: false
      issuedBy:
        data_type: varchar
        description: "Authority that issued the registration"
        business_label: "Issued By / Authority"
        nullable: true
        is_filter: false
        is_aggregation: false
      validFrom:
