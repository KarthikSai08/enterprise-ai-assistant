        description: "Date from which registration is valid"
        business_label: "Valid From / Effective From"
        nullable: true
        is_filter: true
        is_aggregation: false
      validTo:
        data_type: date
        description: "Date until which registration is valid"
        business_label: "Valid To / Expiry Date"
        nullable: true
        is_filter: true
        is_aggregation: false
      isActive:
        data_type: bit
        description: "1 = active, 0 = inactive"
        business_label: "Active"
        nullable: false
        is_filter: true
        is_aggregation: false
    filters:
      - organizationId
      - regType
      - regNumber
      - validFrom
      - validTo
    aggregation_columns: []
    notes: >
      Child of tbl_Organization. Track registration renewals via validTo.

  tbl_OrgAddress:
