    domain: rates
    priority: 2
    is_view: false
    columns:
      idRateBand:
        data_type: int
        description: "Primary key — unique rate band ID"
        business_label: "Rate Band ID"
        nullable: false
        is_filter: false
        is_aggregation: false
      globalPurchaseRateId:
        data_type: int
        description: "Foreign key to tbl_GlobalPurchaseRate"
        business_label: "Purchase Rate Reference"
        nullable: false
        is_filter: true
        is_aggregation: false
        references: "tbl_GlobalPurchaseRate.idGlobalPurchaseRate"
      bandFrom:
        data_type: decimal
        description: "Lower bound of the quantity band"
        business_label: "Band From / Min Qty for Band"
        nullable: false
        is_filter: false
        is_aggregation: false
      bandTo:
        data_type: decimal
        description: "Upper bound of the quantity band"
        business_label: "Band To / Max Qty for Band"
        nullable: false
        is_filter: false
        is_aggregation: false
      bandRate:
        data_type: decimal
        description: "Rate applicable for this band range"
        business_label: "Band Rate / Slab Rate"
        nullable: false
        is_filter: false
        is_aggregation: true
      createdOn:
        data_type: datetime
        description: "Date when the rate band was declared"
        business_label: "Band Declaration Date"
        nullable: false
        is_filter: true
        is_aggregation: false
      isActive:
        data_type: bit
        description: "1 = active, 0 = inactive"
        business_label: "Active"
        nullable: false
        is_filter: true
        is_aggregation: false
    filters:
      - globalPurchaseRateId
      - createdOn
      - isActive
    aggregation_columns:
      - bandRate
    notes: >
      Child of tbl_GlobalPurchaseRate. Use with parent for complete
