        business_label: "Grade ID"
        nullable: false
        is_filter: false
        is_aggregation: false
      productId:
        data_type: int
        description: "Foreign key to tbl_ProductMaster"
        business_label: "Product"
        nullable: false
        is_filter: true
        is_aggregation: false
        references: "tbl_ProductMaster.idProduct"
      gradeCode:
        data_type: varchar
        description: "Short grade code"
        business_label: "Grade Code / Quality Code"
        nullable: false
        is_filter: true
        is_aggregation: false
      gradeName:
        data_type: varchar
        description: "Full grade name"
        business_label: "Grade Name / Quality Grade"
        nullable: false
        is_filter: true
        is_aggregation: false
      specification:
        data_type: varchar
        description: "Technical specification for this grade"
        business_label: "Specification / Technical Specs"
        nullable: true
        is_filter: false
        is_aggregation: false
      isActive:
        data_type: bit
        description: "1 = active, 0 = inactive"
        business_label: "Active"
        nullable: false
        is_filter: true
        is_aggregation: false
    filters:
      - productId
      - gradeName
      - gradeCode
    aggregation_columns: []
    notes: >
      Child of tbl_ProductMaster. Joined by tbl_SaleInvoiceDetail,
      tbl_Booking, tbl_PurchaseSchedule, tbl_StockLedger, and others.

  tbl_ProductPricing:
    display_name: "Product Pricing"
    purpose: >
      Historical pricing records for product-grade combinations. Use for
      price history, price changes, and effective rate queries.
    domain: product
    priority: 2
    is_view: false
    columns:
      idPricing:
        data_type: int
        description: "Primary key — unique pricing record ID"
        business_label: "Pricing ID"
        nullable: false
        is_filter: false
        is_aggregation: false
      productId:
        data_type: int
        description: "Foreign key to tbl_ProductMaster"
        business_label: "Product"
        nullable: false
        is_filter: true
        is_aggregation: false
        references: "tbl_ProductMaster.idProduct"
      gradeId:
        data_type: int
        description: "Foreign key to tbl_ProductGrade"
        business_label: "Grade"
        nullable: true
        is_filter: true
        is_aggregation: false
        references: "tbl_ProductGrade.idGrade"
      priceType:
        data_type: varchar
        description: "Type of price (e.g., Retail, Wholesale, Distributor)"
        business_label: "Price Type"
        nullable: false
        is_filter: true
        is_aggregation: false
      unitPrice:
        data_type: decimal
        description: "Price per unit"
        business_label: "Unit Price / Rate"
        nullable: false
        is_filter: false
        is_aggregation: true
      effectiveFrom:
        data_type: datetime
        description: "Date/time from which this pricing is valid"
        business_label: "Effective From / Valid From"
        nullable: false
        is_filter: true
        is_aggregation: false
      effectiveTo:
        data_type: datetime
        description: "Date/time until which this pricing is valid"
        business_label: "Effective To / Valid Until"
        nullable: true
        is_filter: true
        is_aggregation: false
      isActive:
        data_type: bit
        description: "1 = active, 0 = inactive"
        business_label: "Active"
        nullable: false
        is_filter: true
        is_aggregation: false
    filters:
      - productId
      - gradeId
      - priceType
      - effectiveFrom
      - effectiveTo
    aggregation_columns:
      - unitPrice
    notes: >
      Use effectiveFrom/effectiveTo for date-range effective pricing.
      For 'current price', filter effectiveFrom <= GETDATE() AND
      (effectiveTo IS NULL OR effectiveTo >= GETDATE()).

  # ===========================================================================
  # RATES DOMAIN (Priority 2)
  # ===========================================================================

  tbl_GlobalSaleRate:
    display_name: "Global Sale Rate"
    purpose: >
      Daily sale rate declarations by product-grade. Use for questions about
      current selling price, rate per unit, or historical sale rate trends.
    domain: rates
    priority: 2
    is_view: false
    columns:
      idGlobalRate:
        data_type: int
        description: "Primary key — unique sale rate ID"
        business_label: "Sale Rate ID"
        nullable: false
        is_filter: false
        is_aggregation: false
      productId:
        data_type: int
        description: "Foreign key to tbl_ProductMaster"
        business_label: "Product"
        nullable: false
        is_filter: true
        is_aggregation: false
        references: "tbl_ProductMaster.idProduct"
      gradeId:
        data_type: int
        description: "Foreign key to tbl_ProductGrade"
        business_label: "Grade"
        nullable: true
        is_filter: true
        is_aggregation: false
        references: "tbl_ProductGrade.idGrade"
      saleRate:
        data_type: decimal
        description: "Declared selling rate per unit"
        business_label: "Sale Rate / Selling Rate / Price"
        nullable: false
        is_filter: false
        is_aggregation: true
      minQty:
        data_type: decimal
        description: "Minimum quantity for this rate"
        business_label: "Minimum Quantity"
        nullable: true
        is_filter: false
        is_aggregation: false
      maxQty:
        data_type: decimal
        description: "Maximum quantity for this rate"
        business_label: "Maximum Quantity"
        nullable: true
        is_filter: false
        is_aggregation: false
      createdOn:
        data_type: datetime
        description: "Date and time when the rate was declared"
        business_label: "Rate Date / Declared On"
        nullable: false
        is_filter: true
        is_aggregation: false
      createdBy:
        data_type: int
        description: "User ID who declared the rate"
        business_label: "Created By"
        nullable: true
        is_filter: false
        is_aggregation: false
      isActive:
        data_type: bit
        description: "1 = active, 0 = inactive"
        business_label: "Active"
        nullable: false
        is_filter: true
        is_aggregation: false
    filters:
      - productId
      - gradeId
      - createdOn
      - isActive
    aggregation_columns:
      - saleRate
    notes: >
      For 'current sale rate', use TOP 1 ORDER BY createdOn DESC where
      isActive=1. Separate from tbl_GlobalPurchaseRate.

  tbl_GlobalPurchaseRate:
    display_name: "Global Purchase Rate"
    purpose: >
      Daily purchase/procurement rate declarations by product-grade. Use for
      questions about buying rate, procurement cost, or purchase rate trends.
    domain: rates
    priority: 2
    is_view: false
    columns:
      idGlobalPurchaseRate:
        data_type: int
        description: "Primary key — unique purchase rate ID"
        business_label: "Purchase Rate ID"
        nullable: false
        is_filter: false
        is_aggregation: false
      productId:
        data_type: int
        description: "Foreign key to tbl_ProductMaster"
        business_label: "Product"
        nullable: false
        is_filter: true
        is_aggregation: false
        references: "tbl_ProductMaster.idProduct"
      gradeId:
        data_type: int
        description: "Foreign key to tbl_ProductGrade"
        business_label: "Grade"
        nullable: true
        is_filter: true
        is_aggregation: false
        references: "tbl_ProductGrade.idGrade"
      purchaseRate:
        data_type: decimal
        description: "Declared purchase rate per unit"
        business_label: "Purchase Rate / Buying Rate / Procurement Rate"
        nullable: false
        is_filter: false
        is_aggregation: true
      minQty:
        data_type: decimal
        description: "Minimum quantity for this rate"
        business_label: "Minimum Quantity"
        nullable: true
        is_filter: false
        is_aggregation: false
      maxQty:
        data_type: decimal
        description: "Maximum quantity for this rate"
        business_label: "Maximum Quantity"
        nullable: true
        is_filter: false
        is_aggregation: false
      createdOn:
        data_type: datetime
        description: "Date and time when the purchase rate was declared"
        business_label: "Rate Date / Declared On"
        nullable: false
        is_filter: true
        is_aggregation: false
      createdBy:
        data_type: int
        description: "User ID who declared the rate"
        business_label: "Created By"
        nullable: true
        is_filter: false
        is_aggregation: false
      isActive:
        data_type: bit
        description: "1 = active, 0 = inactive"
        business_label: "Active"
        nullable: false
        is_filter: true
        is_aggregation: false
    filters:
      - productId
      - gradeId
      - createdOn
      - isActive
    aggregation_columns:
      - purchaseRate
    notes: >
      Separate from tbl_GlobalSaleRate (which is for sales). Parent table
      for tbl_RateBand. For 'current purchase rate', use TOP 1 ORDER BY
      createdOn DESC where isActive=1.

  tbl_RateBand:
    display_name: "Rate Band"
    purpose: >
      Defines purchase rate bands/slabs for tiered procurement pricing.
