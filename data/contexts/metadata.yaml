      isActive:
        data_type: bit
        description: "1 = active, 0 = inactive"
        business_label: "Active"
        nullable: false
        is_filter: true
        is_aggregation: false
    filters:
      - organizationId
      - addressType
      - cityId
      - isDefault
    aggregation_columns: []
    notes: >
      Child of tbl_Organization. Multiple addresses allowed per organization
      distinguished by addressType.

  # ===========================================================================
  # PRODUCT DOMAIN (Priority 2)
  # ===========================================================================

  tbl_ProductCategory:
