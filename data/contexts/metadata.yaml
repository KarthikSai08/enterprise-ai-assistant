        nullable: false
        is_filter: false
        is_aggregation: false
      taxName:
        data_type: varchar
        description: "Tax rate name (e.g., GST 5%, GST 12%)"
        business_label: "Tax Name / GST Slab"
        nullable: false
        is_filter: true
        is_aggregation: false
      taxRate:
        data_type: decimal
        description: "Tax percentage value"
        business_label: "Tax Rate / Tax Percentage"
        nullable: false
        is_filter: false
        is_aggregation: true
      taxType:
        data_type: varchar
        description: "Tax type category (e.g., GST, IGST)"
        business_label: "Tax Type"
        nullable: true
