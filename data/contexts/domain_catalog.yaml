# -----------------------------------------------------------------------------
# DOMAIN CONFLICT RULES
# When multiple domains match, these rules resolve the conflict.
# -----------------------------------------------------------------------------

conflict_resolution:

  - rule: "If 'sales' and 'purchase' both match, check for 'invoice' keyword -> prefer sales"
  - rule: "If 'rates' and 'purchase' both match, look for 'purchase rate' phrase -> prefer rates"
  - rule: "If 'hr_payroll' and 'finance_accounts' both match, check for 'salary' keyword -> prefer hr_payroll"
  - rule: "If only master_data keywords match with no transaction keywords -> include both master + the transaction domain that makes sense contextually"
