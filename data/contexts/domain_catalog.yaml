# =============================================================================
# domain_catalog.yaml
# Maps business domains to the tables that answer questions in that domain.
# This is the FIRST layer of retrieval — before any vector search.
#
# Think of it as a routing table:
#   User says "sales" → only look in sales-domain tables → much more accurate
#
# HOW TO SCALE: Add new domain blocks. Add new keywords as users ask
#               questions you haven't covered yet.
# =============================================================================

version: "1.0"
last_updated: "2026-07"

# -----------------------------------------------------------------------------
# SCHEMA:
#   domain_name:
#     description:    what this domain covers
#     primary_tables: tables that directly answer questions in this domain
#     support_tables: tables needed for JOINs/lookups in this domain
#     trigger_keywords: words/phrases that indicate this domain
#     anti_keywords:  words that seem similar but belong to a DIFFERENT domain
#                     (used to prevent wrong domain selection)
# -----------------------------------------------------------------------------

domains:

  sales:
    description: >
      Covers all sales transactions, invoice values, revenue, GST amounts,
      delivery weights, dealer/distributor sales performance, sale orders,
      and sales returns.
    primary_tables:
      - tbl_SaleInvoiceHeader
      - vw_AllInvoices
    support_tables:
      - tbl_SaleInvoiceDetail
      - tbl_SaleOrder
      - tbl_SaleReturn
      - tbl_Organization
      - dim_Status
      - dim_PaymentTerm
      - dim_TaxRate
      - tbl_ProductMaster
    trigger_keywords:
      - sales
      - revenue
      - invoice
      - billing
      - amount
      - grand total
      - gst
      - sgst
      - cgst
      - igst
      - net weight
      - gross weight
      - vehicle number
      - confirmed invoice
      - draft invoice
      - sale order
      - sale return
      - dealer wise
      - distributor wise
      - sold
      - most
      - delivery
      - delivered
      - tonnage
      - weight
    anti_keywords:
      - purchase rate
      - purchase schedule
      - booking
      - employee salary
      - attendance
      - stock transfer

  bookings:
