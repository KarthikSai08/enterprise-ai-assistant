# -----------------------------------------------------------------------------
# MULTI-HOP JOIN PATHS
# Pre-defined paths for common 3+ table joins so the system doesn't have to
# compute them on the fly.
# -----------------------------------------------------------------------------

multi_hop_paths:

  - id: invoice_full_details
    description: "Full invoice details with dealer organization type"
    path:
      - tbl_SaleInvoiceHeader
      - tbl_Organization
        # via dealerOrgId
      - dim_OrgType
        # via OrgTypeId
    sql_template: >
      FROM tbl_SaleInvoiceHeader inv
      LEFT JOIN tbl_Organization org ON inv.dealerOrgId = org.idOrganization
      INNER JOIN dim_OrgType ot ON org.orgTypeId = ot.idOrgType

  - id: invoice_with_line_items
    description: "Invoice with line items and product details"
    path:
      - tbl_SaleInvoiceHeader
      - tbl_SaleInvoiceDetail
        # via idInvoice = invoiceId
      - tbl_ProductMaster
        # via productId = idProduct
    sql_template: >
      FROM tbl_SaleInvoiceHeader inv
      LEFT JOIN tbl_SaleInvoiceDetail det ON inv.idInvoice = det.invoiceId
      LEFT JOIN tbl_ProductMaster prod ON det.productId = prod.idProduct

  - id: booking_status_name
    description: "Get readable status for bookings"
    path:
      - tbl_Booking
      - dim_Status
    sql_template: >
      FROM tbl_Booking b
      LEFT JOIN dim_Status s ON b.statusId = s.idStatus

  - id: schedule_to_product_class
    description: "Get product class for a purchase schedule via its enquiry"
    path:
      - tbl_PurchaseSchedule
      - tbl_PurchaseEnquiry
        # via purchaseEnquiryId = idEnquiry
      - tbl_ProductClass
        # via prodClassId = idProdClass
    sql_template: >
      FROM tbl_PurchaseSchedule ps
      LEFT JOIN tbl_PurchaseEnquiry pe ON ps.purchaseEnquiryId = pe.idEnquiry
      LEFT JOIN tbl_ProductClass pc ON pe.prodClassId = pc.idProdClass

  - id: employee_full_details
    description: "Employee details with department and designation"
    path:
      - tbl_Employee
      - tbl_Department
        # via departmentId = idDepartment
      - tbl_Designation
        # via designationId = idDesignation
    sql_template: >
      FROM tbl_Employee emp
      LEFT JOIN tbl_Department dep ON emp.departmentId = dep.idDepartment
      LEFT JOIN tbl_Designation des ON emp.designationId = des.idDesignation

  - id: stock_ledger_with_product
    description: "Stock ledger with warehouse and product details"
    path:
      - tbl_StockLedger
      - tbl_Warehouse
        # via warehouseId = idWarehouse
      - tbl_ProductMaster
        # via productId = idProduct
    sql_template: >
      FROM tbl_StockLedger sl
      LEFT JOIN tbl_Warehouse wh ON sl.warehouseId = wh.idWarehouse
      LEFT JOIN tbl_ProductMaster prod ON sl.productId = prod.idProduct
